<div class="matches-container">
  <div class="league-tabs">
    <button
      *ngFor="let league of leagues"
      class="tab-btn"
      [class.active]="selectedLeague === league"
      (click)="filterByLeague(league)">
      {{ league }}
    </button>
  </div>

  <div *ngIf="loading" class="status-msg">Loading matches...</div>
  <div *ngIf="error" class="status-msg error">Failed to load matches. Is the backend running?</div>

  <div *ngIf="!loading && !error" class="matches-list">
    <div *ngIf="filteredMatches.length === 0" class="status-msg">
      No matches found for {{ selectedLeague }}.
    </div>

    <div class="match-card" *ngFor="let match of filteredMatches">
      <div class="match-league">{{ match.league }}</div>
      <div class="match-teams">
        <span class="team home">{{ match.homeTeam }}</span>
        <span class="vs">VS</span>
        <span class="team away">{{ match.awayTeam }}</span>
      </div>
      <div class="match-odds">
        <div class="odd-box">
          <span class="odd-label">1</span>
          <span class="odd-value">{{ match.homeOdds.toFixed(2) }}</span>
        </div>
        <div class="odd-box">
          <span class="odd-label">X</span>
          <span class="odd-value">{{ match.drawOdds.toFixed(2) }}</span>
        </div>
        <div class="odd-box">
          <span class="odd-label">2</span>
          <span class="odd-value">{{ match.awayOdds.toFixed(2) }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
